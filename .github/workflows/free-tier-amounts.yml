# The refresh of the free tier's threshold in every merchant currency (#506).
#
# The thresholds are hard-coded (about 100 USD each, rounded down to 2 significant figures) from
# imani-xrate's rates, the estate's hand-set fiat table that gateway-customer and gateway-core
# back vouchers with (owner decision "Option A"), so a threshold and its backing use the same
# numbers. xrate is internal only and this runner cannot reach it, so there is NO schedule: the
# rates only move when an operator changes them in xrate, and that operator then exports them on
# the host (`GET /v1/rates`, see scripts/free-tier-amounts.mts) into
# services/subscription/xrate-rates.json, pushes that file on a branch, and runs this workflow on
# it (or runs the script locally, which does the same). It re-runs scripts/free-tier-amounts.mts
# against the committed export and opens a PR with what changed. Nothing is published until a
# person merges it and the subscription service is redeployed.
#
# The run FAILS, opening nothing, when a threshold would move by more than 50 % in one go (a bad
# feed reading is likelier than a currency halving in a quarter). GitHub then emails the failure.
# Check the rate by hand, then run this workflow manually with `force` ticked.
#
# GITHUB_TOKEN-made PRs trigger no other workflow, so the tests that guard the table run here,
# before the PR is opened.
name: Free-tier amounts

on:
  # Manual only (see above): run it from the branch that carries the new xrate-rates.json.
  workflow_dispatch:
    inputs:
      force:
        description: Accept a threshold that moved by more than 50 % (check the rate first)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: free-tier-amounts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: chore/free-tier-amounts
      # Outside the checkout, so the summary is never committed. (`runner.temp` is not available
      # at job level.)
      SUMMARY: /tmp/free-tier-summary.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Regenerate the amounts from the committed imani-xrate export
        env:
          FREE_TIER_SUMMARY: ${{ env.SUMMARY }}
        run: npx tsx scripts/free-tier-amounts.mts ${{ inputs.force && '--force' || '' }}

      - name: Anything to propose?
        id: diff
        run: |
          if git diff --quiet; then
            echo "No threshold changed at the committed imani-xrate rates." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: The guards on the table still hold
        if: steps.diff.outputs.changed == 'true'
        run: >
          npx vitest run
          packages/licence
          services/subscription
          src/lib/__tests__/freeTierCurrencies.test.ts
          src/lib/__tests__/xrateRates.test.ts
          src/lib/__tests__/currencies.test.ts
          src/lib/__tests__/entitlement.test.ts

      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add services/subscription/xrate-rates.json
          git commit -qam "chore(subscriptions): refresh the free-tier amounts from imani-xrate (#506)"
          git push -qf origin "$BRANCH"

          body="$(cat "$SUMMARY")

          Opened by \`.github/workflows/free-tier-amounts.yml\` (#506). The rates are imani-xrate's (see the version above): check the larger moves against xrate's history before merging. After merging, redeploy the subscription service so it serves the new catalog version. Wallets pick it up within a day, and the bundled copy with the next release."

          existing="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "Updated PR #$existing" >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "chore(subscriptions): refresh the free-tier amounts ($(date -u +%Y-%m-%d))" --body "$body"; then
            :
          else
            # The repository may not let Actions open PRs (Settings > Actions > General). The branch
            # is pushed either way, so say where it is rather than fail silently.
            gh issue create --title "Free-tier amounts refresh ready to review ($(date -u +%Y-%m-%d))" \
              --body "$body

          Actions could not open the PR itself. Open it from https://github.com/${{ github.repository }}/compare/$BRANCH"
          fi
