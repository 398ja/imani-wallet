# IW-17: fail the build on a high-severity advisory in the PRODUCTION tree.
#
# The estate runs no SCA anywhere (P8 in the AppSec review), so an advisory with a fix available
# sat in the shipped bundle until somebody happened to run `npm audit` by hand. This is the
# narrow version of that control: production dependencies only, high and above only.
#
# Dev dependencies are deliberately out of scope here. They are numerous, they churn, and a
# vulnerability in a test runner is not a vulnerability in the wallet a customer loads — gating
# on them means the gate gets disabled, and a disabled gate protects nothing.
name: security-audit

# SAST, SCA and secret scanning for the wallet PWA and its Node services.
#
# P8 in the 2026-09-13 review: no repository in the estate ran any of the three. The npm audit
# job landed with the Phase 2 IW-17 fix; Semgrep and gitleaks join it here so all three questions
# are asked on every push.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories are published against code that has not changed, so a push-only trigger never
    # learns about them.
    - cron: '0 6 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        run: npm run audit:prod

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Validate the ruleset
        # A malformed rule silently scans nothing, which looks exactly like a clean scan.
        run: semgrep --config .semgrep/ --validate
      - name: Prove the rules still FIRE
        # --validate proves the rules parse, not that they still match. A rule broken by an
        # upgrade or a typo reports clean forever and is indistinguishable from a healthy one.
        run: ./.semgrep/fixtures/check-rules-fire.sh
      - name: Scan
        run: semgrep --config .semgrep/ --error --severity=ERROR --severity=WARNING .

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a credential deleted in a later commit is still in every clone.
          fetch-depth: 0
      # The gitleaks BINARY, not gitleaks-action. The action refuses to run for an
      # organization without a paid licence key and fails the job with
      # "missing gitleaks license" — so the scan never ran here at all. The binary
      # is the same scanner with the same config and no such gate.
      - name: Secret scanning (gitleaks)
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
