# The browser performance check, on every commit.
#
# Scope is deliberately the performance check ALONE. The wallet's unit tests are
# not run here: adding them would be a separate decision about what gates a
# merge, and smuggling it into a performance workflow is how a repository ends
# up with CI nobody chose.
#
# No backend. The check restores a recorded fixture into the browser and
# measures against it, which is the whole reason the suite was split in two
# (#15): the gateway suite needs a real deployment and cannot gate anything,
# while this one runs on a laptop or a runner in seconds.
name: Browser performance

on:
  push:
  pull_request:

# A regression on the tip of a branch is the interesting one. Cancelling
# superseded runs keeps a burst of pushes from queueing behind each other.
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-boot:
    runs-on: ubuntu-latest
    # Generous against a cold npm cache and a browser download. The check
    # itself takes about fifteen seconds; anything near this limit is a hang,
    # not a slow run.
    timeout-minutes: 15

    steps:
      # The wallet alone. The @imani/nap-* packages used to be aliased to a
      # sibling ../nap checkout, which this job had to clone and install; they
      # are npm dependencies now (#212), so `npm ci` supplies them.
      - uses: actions/checkout@v4
        with:
          path: imani-wallet

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: imani-wallet/package-lock.json

      - run: npm ci
        working-directory: imani-wallet

      # Chromium only. The suite measures this wallet's own cost, not browser
      # differences, and three engines would triple the runtime for a number
      # that says the same thing three ways.
      - run: npx playwright install --with-deps chromium
        working-directory: imani-wallet

      # The check measures dist/, not source, because that is what a customer
      # actually loads.
      - run: npm run build
        working-directory: imani-wallet

      # --require-fixtures, so the check cannot pass by measuring nothing.
      #
      # Snapshots are gitignored apart from the two small committed rungs. If
      # those ever stop being committed, this run measures an empty wallet —
      # which boots fast however badly storage scales — and reports green.
      # The flag makes that state loud instead.
      #
      # NOT --require-shape: the cost-shape assertion needs the full ladder,
      # and the large rungs are deliberately not in the repository. A developer
      # with the local stack runs that.
      # DISABLED, not deleted, and not quietly downgraded to a green run.
      #
      # Unlocking a restored fixture calls nap.login(), which posts to
      # /api/v1/auth/*. A runner has no gateway to answer, so the page renders
      # `Unexpected token 'A', "AggregateError" is not valid JSON` and the
      # wallet stays locked. This step has never once passed.
      #
      # Do NOT "fix" it by stubbing /auth/init and /auth/complete: unlock is
      # INSIDE the measured window (coldBoot.ts sets unlockedMs after it,
      # because a returning customer really pays that cost), so a stub
      # answering instantly would report a different quantity against
      # baselines recorded through a real gateway. See perf/README.md.
      #
      # Re-enable by standing a gateway up in this job. Until then the
      # populated rung is a developer-machine check.
      - name: Measure cold boot against a populated wallet
        if: false
        run: npm run perf -- --require-fixtures
        working-directory: imani-wallet

      # --ceiling-only because the relative band is machine-specific: this
      # same empty boot is ~121ms on a laptop and ~179ms on a runner, which
      # trips the 35% band every run with nothing wrong. The 1000ms ceiling is
      # portable — it is where opening stops feeling immediate on any hardware
      # — so that is what CI enforces. Band outliers are still printed.
      #
      # What CI CAN honestly check: the harness builds, drives a real browser,
      # and the wallet boots. No --require-fixtures, because the populated
      # rung above is what that flag guards and it cannot run here. This
      # measures an empty wallet, which boots fast however badly storage
      # scales, so it is a smoke check and NOT a regression gate.
      - name: Smoke-check that the wallet boots under measurement
        run: npm run perf -- --empty-only --ceiling-only
        working-directory: imani-wallet

      # Kept whatever the verdict: a green report is the record of what the
      # numbers were, which is what makes the next regression legible.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: imani-wallet/perf/results/
          if-no-files-found: warn
