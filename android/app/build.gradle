apply plugin: 'com.android.application'

/*
 * Release identity, set by the automated build (imani-deploy scripts/android-apk.sh, android/build-apk.sh):
 *   IMANI_VERSION_NAME  the wallet tag without its "v" (0.51.3); IMANI_VERSION_CODE derived from it,
 *                       major*1_000_000 + minor*1_000 + patch, so every release installs over the last.
 *   IMANI_KEYSTORE / IMANI_KEYSTORE_PASSWORD / IMANI_KEY_ALIAS / IMANI_KEY_PASSWORD  the release key.
 * A local build has none of them: version 0.0.0-dev / code 1, and `assembleRelease` is unsigned
 * (`assembleDebug` is what a developer runs). Nothing secret is ever read from a file in the repo.
 */
def envOr = { String name, String fallback -> System.getenv(name) ?: fallback }
def imaniVersionName = envOr('IMANI_VERSION_NAME', '0.0.0-dev')
def imaniVersionCode = envOr('IMANI_VERSION_CODE', '1').toInteger()
def releaseKeystore = System.getenv('IMANI_KEYSTORE')

android {
    namespace = "xyz.tcheeric.imani.wallet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "xyz.tcheeric.imani.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode imaniVersionCode
        versionName imaniVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Stop AGP rasterising vectors into per-density PNGs. minSdk is 24, so
        // VectorDrawable is native everywhere this runs — and the generated
        // PNGs land in drawable-<dpi>/ while the vector only gets
        // drawable-anydpi-v24/, so on API 23 the raster won (minSdk was 23 then). That breaks
        // @drawable/imani_mark_animated, which needs a real vector to animate,
        // and bakes the light-mode fill into a file values-night cannot reach.
        vectorDrawables.generatedDensities = []
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('IMANI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('IMANI_KEY_ALIAS') ?: 'imani'
                keyPassword System.getenv('IMANI_KEY_PASSWORD') ?: System.getenv('IMANI_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Identity AuthorizationClient for the Drive token (DriveAuthPlugin, #510). Not GoogleSignIn.
    implementation "com.google.android.gms:play-services-auth:21.4.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
