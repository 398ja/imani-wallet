<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://testnut.cashu.space wss://*.nostr.band wss://*.nostr.info; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">

    <!-- Primary Meta Tags -->
    <title>Imani Wallet - Built on Trust, Secured by Math</title>
    <meta name="title" content="Imani Wallet">
    <meta name="description" content="Self-custody digital voucher wallet. Issue, share, and redeem value with cryptographic security.">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6B46C1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Imani">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#6B46C1">

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://testnut.cashu.space">
    <link rel="dns-prefetch" href="https://testnut.cashu.space">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #FFFBEB;
        }
        #root {
            width: 100%;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        /* Loading spinner */
        #app-loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        #app-loading .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6B46C1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #app-loading p {
            color: #6B46C1;
            margin-top: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Loading indicator (removed when app loads) -->
    <div id="app-loading">
        <div class="spinner"></div>
        <p>Loading Imani Wallet...</p>
    </div>

    <canvas id="ComposeTarget"></canvas>

    <script>
        // Remove loading indicator once app is ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loadingEl = document.getElementById('app-loading');
                if (loadingEl) {
                    loadingEl.style.display = 'none';
                }
            }, 500);
        });

        // Register service worker for PWA support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(function(registration) {
                        console.log('[PWA] Service Worker registered:', registration.scope);

                        // Check for updates
                        registration.addEventListener('updatefound', function() {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New version available
                                    console.log('[PWA] New version available. Reload to update.');
                                }
                            });
                        });
                    })
                    .catch(function(error) {
                        console.error('[PWA] Service Worker registration failed:', error);
                    });
            });
        }
    </script>

    <script src="imani-wallet.js"></script>
</body>
</html>
