# The wallet container: static assets, nothing else.
#
# NO /api proxying here, deliberately. The edge owns every backend route
# (imani-deploy/nginx/conf.d/imani.conf, server wallet.staging.398ja.xyz),
# including the nap_auth.lua gate that vite.config.ts's portal-edge-auth plugin
# stands in for during development. A second proxy hop here would hand
# gateway-portal a request that never transited the trusted edge, and the only
# way to make that work would be to put the edge shared secret inside this
# container — which is the one thing the whole design keeps out of reach.
#
# NO Content-Security-Policy here either. connect-src is deployment-specific (the
# relay wss host, the Blossom origin), so the edge sets it. Because this container
# emits none, the edge can use a plain add_header instead of the
# proxy_hide_header + add_header dance the old customer host needs.

server {
    listen 9546;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so they can be cached forever. This also covers the
    # classic scripts legacyBridge.ts injects: Vite emits every `?url` import as
    # a hashed asset, so shared/api.js and friends land here too.
    location /assets/ {
        # =404 rather than falling through to the SPA: a missing asset must be a
        # missing asset, not an index.html served with a JS content type, which
        # surfaces in the console as "Unexpected token '<'".
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The FCaptcha widget and API live behind the edge (imani-deploy). Where no edge
    # serves them (prod today, a gate-less stack), answer 404 rather than the SPA
    # shell, so the widget fails open cleanly instead of parsing HTML as a script.
    location /fcaptcha/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # IW-13: a Content-Security-Policy, shipped HERE rather than only at the edge.
        #
        # This wallet holds its signing key in the page, so an XSS is irreversible theft of
        # funds — there is no session to revoke and no server-side state to roll back. That
        # makes CSP the control that bounds the blast radius of any XSS not yet found, and a
        # policy living in another repository is one that can be dropped by a deploy nobody
        # reviewed. The edge may TIGHTEN connect-src; it must not be the only thing supplying
        # a policy.
        #
        # connect-src stays broad (https:, wss:) because the wallet talks to relays and mints
        # the user chooses at runtime. Narrowing it needs the deployment's relay and blossom
        # origins templated in, which is the follow-up; default-src 'none' plus
        # script-src 'self' is already the part that stops injected script from running.
        #
        # `worker-src 'self' blob:` is qr-scanner, and it is load-bearing: the library
        # decodes in a worker it builds from a Blob URL, so a bare `worker-src 'self'`
        # blocks the worker and the camera runs forever without ever decoding a code.
        # Two CSP headers INTERSECT, so the edge already allowing blob: could not rescue
        # this one — every scan (NIP-05 handle, vreqA… payment request) silently did
        # nothing. The blob is built from our own bundled script; it is not a hole an
        # injected script can widen, because script-src still bars its source.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; manifest-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback — react-router owns /settings, /sell, /records/:id and the
    # rest, and a reload on any of them must serve the app rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
        # Repeated per location on purpose: nginx add_header inheritance is
        # all-or-nothing per level, so a single server-level block would be
        # silently dropped by any location that sets its own.
        # IW-13: a Content-Security-Policy, shipped HERE rather than only at the edge.
        #
        # This wallet holds its signing key in the page, so an XSS is irreversible theft of
        # funds — there is no session to revoke and no server-side state to roll back. That
        # makes CSP the control that bounds the blast radius of any XSS not yet found, and a
        # policy living in another repository is one that can be dropped by a deploy nobody
        # reviewed. The edge may TIGHTEN connect-src; it must not be the only thing supplying
        # a policy.
        #
        # connect-src stays broad (https:, wss:) because the wallet talks to relays and mints
        # the user chooses at runtime. Narrowing it needs the deployment's relay and blossom
        # origins templated in, which is the follow-up; default-src 'none' plus
        # script-src 'self' is already the part that stops injected script from running.
        #
        # `worker-src 'self' blob:` is qr-scanner, and it is load-bearing: the library
        # decodes in a worker it builds from a Blob URL, so a bare `worker-src 'self'`
        # blocks the worker and the camera runs forever without ever decoding a code.
        # Two CSP headers INTERSECT, so the edge already allowing blob: could not rescue
        # this one — every scan (NIP-05 handle, vreqA… payment request) silently did
        # nothing. The blob is built from our own bundled script; it is not a hole an
        # injected script can widen, because script-src still bars its source.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; manifest-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
