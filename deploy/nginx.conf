# The wallet container: static assets, nothing else.
#
# NO /api proxying here, deliberately. The edge owns every backend route
# (imani-deploy/nginx/conf.d/imani.conf, server wallet.staging.398ja.xyz),
# including the nap_auth.lua gate that vite.config.ts's portal-edge-auth plugin
# stands in for during development. A second proxy hop here would hand
# gateway-portal a request that never transited the trusted edge, and the only
# way to make that work would be to put the edge shared secret inside this
# container — which is the one thing the whole design keeps out of reach.
#
# NO Content-Security-Policy here either. connect-src is deployment-specific (the
# relay wss host, the Blossom origin), so the edge sets it. Because this container
# emits none, the edge can use a plain add_header instead of the
# proxy_hide_header + add_header dance the old customer host needs.

server {
    listen 9546;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so they can be cached forever. This also covers the
    # classic scripts legacyBridge.ts injects: Vite emits every `?url` import as
    # a hashed asset, so shared/api.js and friends land here too.
    location /assets/ {
        # =404 rather than falling through to the SPA: a missing asset must be a
        # missing asset, not an index.html served with a JS content type, which
        # surfaces in the console as "Unexpected token '<'".
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback — react-router owns /settings, /sell, /records/:id and the
    # rest, and a reload on any of them must serve the app rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
        # Repeated per location on purpose: nginx add_header inheritance is
        # all-or-nothing per level, so a single server-level block would be
        # silently dropped by any location that sets its own.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
