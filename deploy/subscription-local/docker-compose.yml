# subscription.imani.casa, locally, against REAL Stripe test mode and the staging gateway.
#
#   cd deploy/subscription-local
#   ./up.sh            # builds the image, writes .env from imani-deploy/.env.staging, starts both
#   npm run dev        # in the repo root: the wallet on http://localhost:5173
#   open http://localhost:5173/subscription/
#
# The site lives at /subscription on the WALLET's origin, as in production, because it reads the
# wallet key the wallet keeps in that origin's localStorage. The wallet's Vite dev server proxies
# /subscription to this container (vite.config.ts), so the browser sees one origin.
#
# - `subscription`: the site and service (services/subscription/Dockerfile).
# - `stripe`: the Stripe CLI, forwarding the test account's webhooks to the service, so a real
#   test-card payment in Checkout triggers a real `invoice.paid`.
# Licences are minted and delivered by STAGING gateway-customer, as the staging seller, so a stall
# that exists on wallet.staging.398ja.xyz receives the plan in its wallet.
services:
  subscription:
    image: imani-subscription:local
    build:
      context: ../..
      dockerfile: services/subscription/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports: ["18910:8090"]
    env_file: .env
    environment:
      # The origin the BROWSER is on (the wallet dev server), since NIP-98 signs that URL.
      SUBSCRIPTION_PUBLIC_ORIGIN: ${SUBSCRIPTION_PUBLIC_ORIGIN:-http://localhost:5173}
      SUBSCRIPTION_BASE_PATH: /subscription
    volumes: ["ledger:/data"]
    restart: unless-stopped

  stripe:
    image: stripe/stripe-cli:latest
    command:
      - listen
      - --api-key=${STRIPE_SECRET_KEY}
      - --forward-to=http://subscription:8090/subscription/v1/stripe/webhook
      - --events=invoice.paid,customer.subscription.updated,customer.subscription.deleted
    env_file: .env
    depends_on: [subscription]
    restart: unless-stopped

volumes:
  ledger:
