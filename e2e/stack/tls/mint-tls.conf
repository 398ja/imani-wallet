server {
  listen 7443 ssl;
  server_name mint-tls;
  ssl_certificate     /etc/tls/mint.crt;
  ssl_certificate_key /etc/tls/mint.key;
  resolver 127.0.0.11 valid=10s;
  set $mint http://imani-mint-rest:7777;
  location / {
    proxy_pass $mint;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
