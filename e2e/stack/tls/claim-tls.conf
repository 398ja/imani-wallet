server {
  listen 28443 ssl;
  server_name localhost;
  ssl_certificate     /etc/tls/claim.crt;
  ssl_certificate_key /etc/tls/claim.key;
  resolver 127.0.0.11 valid=10s;
  set $claim http://cashback-claim:8086;
  location / {
    proxy_pass $claim;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
